<!doctype html>
<html>
	<head>
		<title>Matrix digital rain</title>
		<meta charset="utf-8" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
		/>
		<style>
			html,
			body {
				height: 100%;
				overflow: hidden;
				margin: 0;
			}

			@supports (padding-top: env(safe-area-inset-top)) {
				body {
					padding: 0;
					height: calc(100% + env(safe-area-inset-top));
				}
			}

			body {
				background: black;
				font-family: monospace;
				font-size: 2em;
				text-align: center;
			}

			canvas {
				width: 100vw;
				height: 100vh;
			}

			p {
				color: hsl(108, 90%, 70%);
				text-shadow: hsl(108, 90%, 40%) 1px 0 10px;
			}

			.notice {
				margin-top: 10em;
				animation: fadeInAnimation ease 3s;
				animation-iteration-count: 1;
				animation-fill-mode: forwards;
			}

			@keyframes fadeInAnimation {
				0% {
					opacity: 0;
				}
				100% {
					opacity: 1;
				}
			}

			.pill {
				display: inline-block;
				background: gray;
				border: 0.3em solid lightgray;
				font-size: 1rem;
				font-family: monospace;
				color: white;
				padding: 0.5em 1em;
				border-radius: 2em;
				min-width: 6rem;
				margin: 3em;
				text-decoration: none;
				cursor: pointer;
				text-transform: uppercase;
				font-weight: bold;
			}

			.blue {
				background: linear-gradient(skyblue, blue, black, black, darkblue);
				border-color: darkblue;
				color: lightblue;
			}

			.blue:hover {
				border-color: blue;
				color: white;
			}

			.red {
				background: linear-gradient(lightpink, crimson, black, black, darkred);
				border-color: darkred;
				color: lightpink;
			}

			.red:hover {
				border-color: crimson;
				color: white;
			}

			/* Context Menu */
			.matrix-context-menu {
				position: fixed;
				background: rgba(0, 0, 0, 0.95);
				border: 1px solid #0f0;
				padding: 4px 0;
				z-index: 10000;
				min-width: 180px;
				box-shadow: 0 4px 12px rgba(0, 255, 0, 0.3);
			}

			.menu-item {
				padding: 10px 16px;
				cursor: pointer;
				color: #0f0;
				font-size: 0.9rem;
				transition: background 0.2s;
			}

			.menu-item:hover {
				background: rgba(0, 255, 0, 0.2);
			}

			/* Config Panel */
			.matrix-config-panel {
				position: fixed;
				right: 0;
				top: 0;
				width: 420px;
				max-width: 90vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.97);
				border-left: 2px solid #0f0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				transform: translateX(100%);
				transition: transform 0.3s ease;
				overflow: hidden;
				box-shadow: -4px 0 20px rgba(0, 255, 0, 0.2);
			}

			.matrix-config-panel.open {
				transform: translateX(0);
			}

			.panel-header {
				padding: 16px 20px;
				border-bottom: 1px solid #0f0;
				display: flex;
				justify-content: space-between;
				align-items: center;
				background: rgba(0, 255, 0, 0.05);
			}

			.panel-header h2 {
				margin: 0;
				font-size: 1.2rem;
				color: #0f0;
				text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
			}

			.close-btn {
				background: none;
				border: 1px solid #0f0;
				color: #0f0;
				font-size: 1.5rem;
				width: 32px;
				height: 32px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0;
				transition: all 0.2s;
			}

			.close-btn:hover {
				background: rgba(0, 255, 0, 0.2);
				box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
			}

			.panel-controls {
				padding: 12px 20px;
				border-bottom: 1px solid rgba(0, 255, 0, 0.3);
				background: rgba(0, 255, 0, 0.03);
			}

			.panel-controls label {
				display: flex;
				align-items: center;
				gap: 8px;
				color: #0f0;
				font-size: 0.85rem;
				cursor: pointer;
			}

			.panel-controls input[type="checkbox"] {
				cursor: pointer;
			}

			.panel-body {
				flex: 1;
				overflow-y: auto;
				padding: 16px 20px;
			}

			.panel-body::-webkit-scrollbar {
				width: 8px;
			}

			.panel-body::-webkit-scrollbar-track {
				background: rgba(0, 255, 0, 0.05);
			}

			.panel-body::-webkit-scrollbar-thumb {
				background: rgba(0, 255, 0, 0.3);
				border-radius: 4px;
			}

			.panel-body::-webkit-scrollbar-thumb:hover {
				background: rgba(0, 255, 0, 0.5);
			}

			.category {
				margin-bottom: 20px;
			}

			.category-header {
				padding: 10px 12px;
				background: rgba(0, 255, 0, 0.1);
				cursor: pointer;
				border-left: 3px solid #0f0;
				margin-bottom: 12px;
				font-size: 0.95rem;
				color: #0f0;
				font-weight: bold;
				transition: background 0.2s;
				user-select: none;
			}

			.category-header:hover {
				background: rgba(0, 255, 0, 0.15);
			}

			.category-header::after {
				content: "▼";
				float: right;
				transition: transform 0.2s;
			}

			.category.collapsed .category-header::after {
				transform: rotate(-90deg);
			}

			.category-content {
				padding-left: 12px;
				max-height: 2000px;
				overflow: hidden;
				transition:
					max-height 0.3s ease,
					opacity 0.3s ease;
				opacity: 1;
			}

			.category.collapsed .category-content {
				max-height: 0;
				opacity: 0;
			}

			.param-group {
				margin-bottom: 14px;
			}

			.param-group > label {
				display: block;
				color: #0f0;
				margin-bottom: 6px;
				font-size: 0.85rem;
				opacity: 0.9;
			}

			.param-group input,
			.param-group select {
				width: 100%;
				background: rgba(0, 0, 0, 0.8);
				border: 1px solid rgba(0, 255, 0, 0.5);
				color: #0f0;
				padding: 6px 8px;
				font-family: monospace;
				font-size: 0.85rem;
				transition: border-color 0.2s;
			}

			.param-group input:focus,
			.param-group select:focus {
				outline: none;
				border-color: #0f0;
				box-shadow: 0 0 6px rgba(0, 255, 0, 0.3);
			}

			.param-group input[type="checkbox"] {
				width: auto;
				margin: 0;
			}

			.param-group input[type="range"] {
				width: calc(100% - 65px);
				display: inline-block;
				vertical-align: middle;
				-webkit-appearance: none;
				appearance: none;
				height: 6px;
				background: rgba(0, 255, 0, 0.3);
				border-radius: 3px;
				border: none;
				padding: 0;
			}

			.param-group input[type="range"]::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 14px;
				height: 14px;
				background: #0f0;
				border-radius: 50%;
				cursor: pointer;
				box-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
			}

			.param-group input[type="range"]::-moz-range-track {
				height: 6px;
				background: rgba(0, 255, 0, 0.3);
				border-radius: 3px;
			}

			.param-group input[type="range"]::-moz-range-thumb {
				width: 14px;
				height: 14px;
				background: #0f0;
				border-radius: 50%;
				cursor: pointer;
				border: none;
				box-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
			}

			.param-group input[type="number"].range-value {
				width: 55px;
				display: inline-block;
				margin-left: 8px;
				padding: 4px 6px;
				vertical-align: middle;
			}

			.param-group .checkbox-label {
				display: flex;
				align-items: center;
				gap: 8px;
				cursor: pointer;
			}

			.panel-footer {
				padding: 16px 20px;
				border-top: 1px solid #0f0;
				display: flex;
				gap: 8px;
				background: rgba(0, 255, 0, 0.05);
			}

			.panel-footer button {
				flex: 1;
				padding: 10px 12px;
				background: rgba(0, 255, 0, 0.1);
				border: 1px solid #0f0;
				color: #0f0;
				cursor: pointer;
				font-family: monospace;
				font-size: 0.85rem;
				transition: all 0.2s;
				font-weight: bold;
			}

			.panel-footer button:hover {
				background: rgba(0, 255, 0, 0.2);
				box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
			}

			.apply-btn {
				background: rgba(0, 255, 0, 0.2) !important;
				flex: 1.5;
			}

			.apply-btn:hover {
				background: rgba(0, 255, 0, 0.3) !important;
			}

			.pending-badge {
				background: rgba(255, 100, 0, 0.8);
				color: white;
				padding: 2px 6px;
				border-radius: 10px;
				font-size: 0.75rem;
				margin-left: 6px;
			}
		</style>
	</head>
	<body>
		<!--
			This is an implementation of the green code seen in The Matrix film and video game franchise.
			This project demonstrates five concepts:
					1. Drawing to floating point frame buffer objects, or 'FBO's,
						 for performing computation and post-processing
					2. GPU-side computation, with fragment shaders
						 updating two alternating FBOs
					3. Rendering crisp "vector" graphics, with a multiple-channel
						 signed distance field (or 'MSDF')
					4. Creating a blur/bloom effect from a texture pyramid
					5. Color mapping with noise, to hide banding

			For more information, please visit: https://github.com/Rezmason/matrix
		 -->
		<script type="module" src="js/main.js"></script>
	</body>
</html>
